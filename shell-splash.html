<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>👻 Ghost of the Day — inline post preview</title>
    <style>
/*{{CSS}}*/
      .preview-ribbon {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        padding: 4px 12px 5px;
        border-radius: 0 0 10px 10px;
        background: rgba(255, 190, 85, 0.16);
        border: 1px solid rgba(255, 190, 85, 0.35);
        border-top: none;
        color: #ffd489;
        font: 600 10.5px/1.3 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
      }

      /* The inline post card is short: ~300px in the feed. */
      body.splash {
        max-height: 320px;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="splash">
    <div class="scene">
      <div class="hero">
        <div class="hero-art" id="hero-art"></div>
        <div class="hero-copy">
          <h1>Ghost of the Day <span id="dayno">#…</span></h1>
          <p id="blurb">
            A ghost is hiding in the mansion. Six candles, one catch. Same ghost for
            every Redditor today.
          </p>
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <button type="button" class="btn primary cta" id="play-btn">
        Enter the mansion
      </button>
    </div>

    <script>
/*{{MOCK}}*/
    </script>
    <script type="module">
/*{{APP}}*/
    </script>
  </body>
</html>
