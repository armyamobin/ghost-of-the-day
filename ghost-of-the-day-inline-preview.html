<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>👻 Ghost of the Day — inline post preview</title>
    <style>
/* 👻 Ghost of the Day — one stylesheet for the inline post (splash) and the
   expanded game. No external fonts or assets: everything ships in the bundle so
   the webview works inside Reddit's CSP. */

:root {
  --night: #07050f;
  --night-2: #100a1f;
  --panel: rgba(24, 16, 43, 0.72);
  --line: rgba(150, 120, 255, 0.22);
  --ink: #ece7ff;
  --ink-dim: #a99ed0;
  --amber: #ffbe55;
  --amber-hot: #ff9d2e;
  --here: #e9dcff;
  --hot: #ff5a6a;
  --warm: #ffb545;
  --cold: #6ea8ff;
  --violet: #a97cff;
  --radius: 14px;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-spooky: ui-serif, "Iowan Old Style", Palatino, Georgia, serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
}

body {
  background:
    radial-gradient(120% 80% at 50% -10%, #241546 0%, rgba(16, 10, 31, 0.6) 45%, transparent 70%),
    radial-gradient(80% 60% at 100% 110%, rgba(72, 40, 130, 0.5) 0%, transparent 60%),
    radial-gradient(70% 50% at 0% 100%, rgba(30, 60, 120, 0.35) 0%, transparent 60%),
    var(--night);
  background-attachment: fixed;
}

/* Drifting fog. Pure CSS, two soft blobs, very cheap. */
body::before,
body::after {
  content: "";
  position: fixed;
  inset: -20%;
  pointer-events: none;
  background: radial-gradient(38% 32% at 30% 40%, rgba(120, 90, 220, 0.16), transparent 70%);
  animation: drift 26s ease-in-out infinite alternate;
  z-index: 0;
}

body::after {
  background: radial-gradient(30% 26% at 70% 65%, rgba(60, 110, 200, 0.14), transparent 70%);
  animation-duration: 34s;
  animation-direction: alternate-reverse;
}

@keyframes drift {
  from {
    transform: translate3d(-3%, -2%, 0) scale(1);
  }
  to {
    transform: translate3d(4%, 3%, 0) scale(1.12);
  }
}

/* ------------------------------------------------------------------ layout */

.scene {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding: 14px 14px 26px;
}

.game .scene {
  min-height: 100dvh;
  justify-content: safe center;
}

.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hud-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.logo {
  font-size: 20px;
  filter: drop-shadow(0 0 8px rgba(169, 124, 255, 0.8));
  animation: bob 4.5s ease-in-out infinite;
}

@keyframes bob {
  0%,
  100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-4px) rotate(3deg);
  }
}

.title {
  font-family: var(--font-spooky);
  font-size: 15px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.title b {
  color: var(--amber);
  font-weight: 600;
}

.hud-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.candles {
  display: flex;
  gap: 2px;
  font-size: 15px;
  line-height: 1;
}

.candles span {
  transition: opacity 0.35s ease, filter 0.35s ease, transform 0.35s ease;
}

.candles span.spent {
  opacity: 0.22;
  filter: grayscale(1);
  transform: scale(0.86);
}

.streak {
  font-size: 13px;
  font-weight: 700;
  color: var(--amber);
  white-space: nowrap;
}

.streak.idle {
  color: var(--ink-dim);
  font-weight: 500;
}

.hint {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-dim);
  text-align: center;
  min-height: 2.9em;
}

.hint strong {
  color: var(--ink);
  font-weight: 600;
}

/* ------------------------------------------------------------------- board */

.board {
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(var(--grid, 7), 1fr);
  gap: 6px;
  padding: 10px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 120% at 50% 0%, rgba(80, 52, 140, 0.35), transparent 60%),
    rgba(11, 7, 22, 0.72);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 18px 40px -24px #000;
}

.tile {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  padding: 0;
  border: 1px solid rgba(140, 110, 220, 0.18);
  border-radius: 9px;
  background:
    linear-gradient(180deg, rgba(38, 26, 68, 0.9), rgba(20, 13, 36, 0.95));
  color: var(--ink);
  font-size: clamp(15px, 5.1vw, 22px);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.25s ease;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

/* Whisper of a different room behind each door. */
.tile:nth-child(3n + 1) {
  background: linear-gradient(165deg, rgba(44, 30, 80, 0.92), rgba(19, 12, 34, 0.96));
}

.tile:nth-child(4n + 2) {
  background: linear-gradient(15deg, rgba(38, 26, 70, 0.92), rgba(16, 11, 29, 0.96));
}

.tile:nth-child(5n + 3) {
  background: linear-gradient(200deg, rgba(33, 24, 62, 0.92), rgba(21, 14, 38, 0.96));
}

/* Unlit rooms show a faint dust speck so the mansion reads as "unexplored". */
.tile::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(40% 40% at 30% 30%, rgba(255, 255, 255, 0.05), transparent 70%);
  opacity: 0.9;
}

.tile:disabled {
  cursor: default;
}

.tile.can-probe:hover,
.tile.can-probe:focus-visible {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px rgba(255, 190, 85, 0.6), 0 0 20px -4px rgba(255, 190, 85, 0.75);
  transform: translateY(-1px);
  outline: none;
}

.tile.probed {
  border-color: rgba(255, 255, 255, 0.18);
}

.tile.probed::after {
  opacity: 0;
}

.tile[data-band="0"] {
  background: radial-gradient(circle at 50% 55%, #ffffff, #d9c4ff 55%, #9d76e8);
  border-color: #fff;
  box-shadow: 0 0 26px -2px rgba(210, 180, 255, 0.85);
  animation: catchPop 0.5s ease-out;
}

.tile[data-band="1"] {
  background: radial-gradient(circle at 50% 60%, rgba(255, 90, 106, 0.55), rgba(90, 20, 40, 0.55));
  border-color: rgba(255, 90, 106, 0.6);
}

.tile[data-band="2"] {
  background: radial-gradient(circle at 50% 60%, rgba(255, 181, 69, 0.45), rgba(80, 50, 10, 0.5));
  border-color: rgba(255, 181, 69, 0.5);
}

.tile[data-band="3"] {
  background: radial-gradient(circle at 50% 60%, rgba(110, 168, 255, 0.3), rgba(16, 26, 56, 0.6));
  border-color: rgba(110, 168, 255, 0.35);
}

.tile .glyph {
  position: relative;
  z-index: 1;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
}

.tile.fresh {
  animation: tileIn 0.42s cubic-bezier(0.2, 0.9, 0.2, 1);
}

.tile.sweeping::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(255, 214, 140, 0.9), transparent 65%);
  animation: sweep 0.45s ease-out forwards;
  z-index: 2;
  pointer-events: none;
}

@keyframes tileIn {
  from {
    transform: scale(0.82);
    opacity: 0.4;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes sweep {
  from {
    opacity: 0.95;
    transform: scale(0.6);
  }
  to {
    opacity: 0;
    transform: scale(1.5);
  }
}

@keyframes catchPop {
  0% {
    transform: scale(0.9);
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.9);
  }
  45% {
    transform: scale(1.12);
    box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.06);
  }
  100% {
    transform: scale(1);
  }
}

/* The ghost, rendered inside its room once the day is over. */
.ghost-mark {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 3;
  animation: ghostIn 0.6s ease-out both;
}

.ghost-mark svg {
  width: 92%;
  height: 92%;
  filter: drop-shadow(0 0 8px rgba(220, 200, 255, 0.95));
  animation: float 3.4s ease-in-out infinite;
}

@keyframes ghostIn {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.7);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes float {
  0%,
  100% {
    transform: translateY(-3%) rotate(-2deg);
  }
  50% {
    transform: translateY(3%) rotate(2deg);
  }
}

/* ----------------------------------------------------------------- overlay */

.overlay {
  position: absolute;
  inset: -6px;
  display: grid;
  place-items: center;
  padding: 12px;
  border-radius: 20px;
  background: rgba(7, 4, 14, 0.78);
  backdrop-filter: blur(7px);
  z-index: 10;
  animation: fadeIn 0.3s ease-out;
}

.overlay.hidden {
  display: none;
}

.overlay-card {
  width: 100%;
  text-align: center;
  padding: 6px 4px;
}

.ghost-art {
  width: 84px;
  height: 84px;
  margin: 0 auto 4px;
}

.ghost-art svg {
  width: 100%;
  height: 100%;
  animation: float 3.2s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(190, 160, 255, 0.85));
}

.ghost-art.gone svg {
  opacity: 0.35;
  filter: grayscale(0.7) blur(0.6px);
  animation: none;
}

#result-title {
  margin: 3px 0 4px;
  font-family: var(--font-spooky);
  font-size: 21px;
  letter-spacing: 0.01em;
}

#result-text {
  margin: 0 auto 12px;
  max-width: 32ch;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-dim);
}

#result-text b {
  color: var(--amber);
}

.result-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: stretch;
  max-width: 260px;
  margin: 0 auto;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ----------------------------------------------------------------- buttons */

.btn {
  font: inherit;
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: 0.01em;
  padding: 11px 16px;
  border-radius: 11px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.btn:active {
  transform: translateY(1px) scale(0.995);
}

.btn.primary {
  color: #2a1600;
  background: linear-gradient(180deg, #ffd489, var(--amber-hot));
  box-shadow: 0 8px 24px -10px rgba(255, 170, 60, 0.9);
}

.btn.primary:hover {
  box-shadow: 0 10px 28px -8px rgba(255, 190, 85, 0.95);
}

.btn.ghost-btn {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--line);
}

.btn.ghost-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* ------------------------------------------------------------------ panels */

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.panel {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.panel h3 {
  margin: 0 0 7px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12.5px;
}

.list li {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.list .rank {
  width: 1.1em;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}

.list .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list .score {
  color: var(--amber);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.list li.you .name {
  color: var(--amber);
  font-weight: 700;
}

.list .empty {
  color: var(--ink-dim);
  font-style: italic;
}

.stats {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-dim);
  white-space: nowrap;
}

.stats b {
  color: var(--ink);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.footnote {
  margin: 0;
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
  color: rgba(169, 158, 208, 0.75);
}

/* ------------------------------------------------------------------- toast */

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translate(-50%, 12px);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  color: var(--ink);
  background: rgba(30, 20, 52, 0.96);
  border: 1px solid var(--line);
  box-shadow: 0 12px 30px -12px #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 40;
  max-width: 84vw;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ------------------------------------------------------------------ splash */

.splash .scene {
  min-height: 100dvh;
  justify-content: center;
  gap: 10px;
  padding: 12px 14px;
}

.splash .hero {
  display: flex;
  align-items: center;
  gap: 12px;
}

.splash .hero-art {
  width: 66px;
  height: 66px;
  flex: 0 0 auto;
}

.splash .hero-art svg {
  width: 100%;
  height: 100%;
  animation: float 3.4s ease-in-out infinite;
  filter: drop-shadow(0 0 14px rgba(190, 160, 255, 0.8));
}

.splash .hero-copy {
  min-width: 0;
}

.splash .hero-copy h1 {
  margin: 0 0 2px;
  font-family: var(--font-spooky);
  font-size: 17px;
  letter-spacing: 0.01em;
}

.splash .hero-copy p {
  margin: 0;
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-dim);
}

.splash .chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  font-size: 11.5px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink-dim);
  white-space: nowrap;
}

.chip b {
  color: var(--ink);
  font-weight: 650;
}

.chip.flame {
  color: var(--amber);
  border-color: rgba(255, 190, 85, 0.4);
  background: rgba(255, 190, 85, 0.1);
}

.splash .cta {
  width: 100%;
}

/* Wider viewports: board beside the panels. */
@media (min-width: 560px) {
  .scene {
    max-width: 720px;
  }

  .game .scene {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 232px;
    grid-template-areas:
      "hud hud"
      "hint hint"
      "board panels"
      "board foot";
    align-content: start;
    align-items: start;
    gap: 14px;
  }

  .game .hud {
    grid-area: hud;
  }

  .game .hint {
    grid-area: hint;
    text-align: left;
  }

  .game .board {
    grid-area: board;
  }

  .game .panels {
    grid-area: panels;
    grid-template-columns: 1fr;
  }

  .game .stats {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .game .footnote {
    grid-area: foot;
    text-align: left;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

      .preview-ribbon {

    <script>
/**
 * Preview-only fake backend.
 *
 * The real app talks to `/api/*` endpoints served by Devvit. This file stubs
 * `fetch` with the same payload shapes and the same rules so the *actual built
 * client bundle* can run as a plain HTML file (and be demoed offline).
 *
 * Rules are duplicated here on purpose: this file never ships to Reddit.
 */
(function () {
  var GRID = 7;
  var ROOMS = 49;
  var CANDLES = 6;

  function hash32(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function dayNumber(day) {
    var parts = day.split('-').map(Number);
    var epoch = Date.UTC(2026, 0, 1);
    var then = Date.UTC(parts[0], parts[1] - 1, parts[2]);
    return Math.floor((then - epoch) / 86400000) + 1;
  }

  function ghostRoom(day) {
    return Math.floor(mulberry32(hash32('ghost-of-the-day:v1:' + day))() * ROOMS);
  }

  function distance(a, b) {
    return Math.abs(Math.floor(a / GRID) - Math.floor(b / GRID)) + Math.abs((a % GRID) - (b % GRID));
  }

  function band(d) {
    if (d <= 0) return 0;
    if (d <= 3) return 1;
    if (d <= 6) return 2;
    return 3;
  }

  // Sandboxed iframes (like the workspace viewer) throw on localStorage.
  var store = (function () {
    try {
      window.localStorage.setItem('__probe__', '1');
      window.localStorage.removeItem('__probe__');
      return window.localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function (k) {
          return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
        },
        setItem: function (k, v) {
          mem[k] = String(v);
        },
        removeItem: function (k) {
          delete mem[k];
        },
      };
    }
  })();

  function read(key, fallback) {
    try {
      var raw = store.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function write(key, value) {
    try {
      store.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* quota or blocked: preview still plays */
    }
  }

  function play(day) {
    var p = read('god:play:' + day, { p: [], s: 0 });
    if (!Array.isArray(p.p)) p = { p: [], s: 0 };
    return p;
  }

  function stats() {
    return read('god:stats', { streak: 0, best: 0, last: '', wins: 0, plays: 0, total: 0 });
  }

  var HUNTERS = [
    'ghosted_again',
    'candle_hoe',
    'spooky_szn',
    'room_D4',
    'midnight_mod',
    'casper_fan',
    'vault_13',
    'snoo_ghost',
    'third_floor',
    'ouija_enjoyer',
  ];

  function fakeBoard(day) {
    var rand = mulberry32(hash32('board:' + day));
    var pool = HUNTERS.slice();
    var out = [];
    var count = 3 + Math.floor(rand() * 4);
    for (var i = 0; i < count && pool.length; i++) {
      var idx = Math.floor(rand() * pool.length);
      var name = pool.splice(idx, 1)[0];
      out.push({ name: name, candles: 2 + Math.floor(rand() * 5), isYou: false });
    }
    return out;
  }

  function fakeStreaks(day) {
    var rand = mulberry32(hash32('streaks:' + day));
    var out = [];
    for (var i = 0; i < 3 && i < HUNTERS.length; i++) {
      out.push({
        name: HUNTERS[(i * 3 + 1) % HUNTERS.length],
        streak: 2 + Math.floor(rand() * 12),
        isYou: false,

    }
    return out;
  }

  function payload() {
    var day = today();
    var p = play(day);
    var st = stats();
    var ghosts = ghostRoom(day);
    var mine = read('god:board:' + day, []);
    var board = fakeBoard(day);
    var used = p.p.length;
    var status = p.s === 1 ? 'caught' : p.s === 2 ? 'fled' : 'playing';
    var you = {
      day: day,
      number: dayNumber(day),
      grid: GRID,
      candles: CANDLES,
      candlesLeft: Math.max(CANDLES - used, 0),
      probes: p.p.map(function (pair) {
        return { i: pair[0], b: pair[1] };

      status: status,
      ghost: status === 'playing' ? null : ghosts,
      streak: st.streak,
      best: st.best,
      wins: st.wins,
      plays: st.plays,

    if (mine.length) {
      board.push({ name: 'you_preview', candles: mine[0], isYou: true });

    return {
      player: you,
      board: board.slice(0, 5),
      streaks: fakeStreaks(day),
      stats: {
        plays: plays,
        catches: catches,
        catchRate: catches / plays,
        avgCandles: 4.3 + ((dayNumber(day) % 7) / 20),
      },
      username: 'you_preview',
    };
  }

  function finalize(day, p) {
    var st = stats();
    if (st.last === day) return;
    var used = p.p.length;
    var caught = p.s === 1;
    var yesterday = new Date(Date.UTC.apply(null, day.split('-').map(Number)) - 86400000)

      .slice(0, 10);
    var streak = 0;
    if (caught) {
      streak = st.last === yesterday ? st.streak + 1 : 1;
      st.wins += 1;
      st.total += used;
      write('god:board:' + day, [used]);
    }
    st.streak = streak;
    st.best = Math.max(st.best, streak);
    st.plays += 1;
    st.last = day;
    write('god:stats', st);
  }

  function json(body) {
    return Promise.resolve(
      new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'Content-Type': 'application/json' },
      }),

  }

  var realFetch = window.fetch ? window.fetch.bind(window) : undefined;

  window.fetch = function (url, init) {

      var existing = p.p.find(function (pair) {
        return pair[0] === cell;
      });
      if (existing) {
        var out = payload();
        return json(Object.assign({}, out, { band: existing[1] }));
      }
      if (p.s !== 0 || p.p.length >= CANDLES || !(cell >= 0 && cell < ROOMS)) {

      }
      var reading = band(distance(cell, ghostRoom(day)));
      p.p.push([cell, reading]);
      if (reading === 0) p.s = 1;
      else if (p.p.length >= CANDLES) p.s = 2;
      write('god:play:' + day, p);
      if (p.s !== 0) finalize(day, p);
      return json(Object.assign({}, payload(), { band: reading }));
    }

    if (path === 'api/share') {
      return json({
        status: 'posted',
        message: 'Preview mode — in Reddit this posts your result as a spoiler-tagged comment.',
      });
    }

    return json({ error: 'not found', status: 404 });
  };
